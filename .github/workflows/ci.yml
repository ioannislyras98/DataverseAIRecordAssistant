name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Restore locked dependencies
        run: dotnet restore DataverseAIRecordAssistant.sln --locked-mode

      - name: Build plug-ins
        run: dotnet build DataverseAIRecordAssistant.sln --configuration Release --no-restore

      - name: Test web resources
        run: npm test

